<!DOCTYPE html>
<html lang="en">
  <head>

    <link rel="preconnect" href="https://bsmachine-backend.onrender.com" crossorigin>
    <link rel="dns-prefetch" href="https://bsmachine-backend.onrender.com">
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex">
    <title>Best Bets</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-900 text-white">
    <div id="site-header"></div>

    <main class="max-w-7xl mx-auto px-4 py-8">
      <div class="flex items-baseline gap-4 mb-2 flex-wrap">
        <h1 class="text-4xl font-bold">Best Bets</h1>
        <span id="updated" class="hidden text-sm font-medium text-gray-500 bg-gray-800 border border-gray-700 px-2.5 py-1 rounded-full"></span>
      </div>

      <!-- Sign-in / restricted card, or nothing once access is confirmed -->
      <div id="gate"><div class="card"><span class="bsm-skeleton h-24 w-full block"></span></div></div>

      <div id="content" class="hidden">
        <p class="text-sm text-gray-400 mb-6">Where the model's price beats the best back price from the bookie. Edge is the expected return per unit staked.</p>

        <div class="grid gap-4 items-start lg:grid-cols-[minmax(0,1fr)_19rem]">
        <div class="card min-w-0">
          <div class="flex items-center justify-between gap-3 flex-wrap mb-4">
            <div id="view-tabs" role="tablist" class="flex items-center bg-gray-900 border border-gray-700 rounded-lg p-0.5 gap-0.5"></div>
            <div class="flex items-center gap-2 flex-wrap text-xs text-gray-400">
              <div id="sport-pills" class="flex items-center gap-1 flex-wrap"></div>
              <div class="flex items-center gap-1" role="group" aria-label="Edge range" title="Only selections with a model edge in this range, both ends included. Leave an end blank for no limit.">Edge
                <input id="edge-min" type="number" min="0" step="any" inputmode="decimal" placeholder="any" value="10" aria-label="Lowest edge, percent"
                       class="w-14 bg-gray-800 border border-gray-600 rounded px-1.5 py-1 text-sm text-white tabular-nums">
                <span aria-hidden="true">–</span>
                <input id="edge-max" type="number" min="0" step="any" inputmode="decimal" placeholder="any" aria-label="Highest edge, percent"
                       class="w-14 bg-gray-800 border border-gray-600 rounded px-1.5 py-1 text-sm text-white tabular-nums">%
              </div>
              <div class="flex items-center gap-1" role="group" aria-label="Odds range" title="Only selections with bookie odds in this range, both ends included. Leave an end blank for no limit.">Odds $
                <input id="odds-min" type="number" min="1" step="any" inputmode="decimal" placeholder="any" aria-label="Lowest odds"
                       class="w-14 bg-gray-800 border border-gray-600 rounded px-1.5 py-1 text-sm text-white tabular-nums">
                <span aria-hidden="true">–</span> $
                <input id="odds-max" type="number" min="1" step="any" inputmode="decimal" placeholder="any" value="10" aria-label="Highest odds"
                       class="w-14 bg-gray-800 border border-gray-600 rounded px-1.5 py-1 text-sm text-white tabular-nums">
              </div>
              <label class="flex items-center gap-1.5" title="How cautious the Stake column is. Low: 99% sure of the edge, under 1% chance of ever losing a quarter of the bank. Medium: 95% sure, under 1% chance of ever losing half. High: 80% sure, under 5% chance of ever losing half.">Risk
                <select id="stake-risk" class="bg-gray-800 border border-gray-600 rounded px-1.5 py-1 text-sm text-white">
                  <option value="low">Low</option>
                  <option value="medium">Medium</option>
                  <option value="high">High</option>
                </select>
              </label>
              <label class="flex items-center gap-1.5" title="Your betting bank, to show stakes in dollars. Kept in this browser only.">Bank $
                <input id="stake-balance" type="number" min="0" step="any" inputmode="decimal" placeholder="optional"
                       class="w-24 bg-gray-800 border border-gray-600 rounded px-1.5 py-1 text-sm text-white tabular-nums">
              </label>
              <label id="sort-wrap"class="flex items-center gap-1.5">Sort
                <select id="sort-by" class="bg-gray-800 border border-gray-600 rounded px-1.5 py-1 text-sm text-white">
                  <option value="edge">Edge</option>
                  <option value="time">Start time</option>
                </select>
              </label>
              <label id="my-teams-wrap" class="hidden flex items-center gap-1.5 cursor-pointer" title="Only games involving a team in My Teams">
                <input id="my-teams-only" type="checkbox" class="accent-amber-400"> My Teams
              </label>
              <label id="three-way-wrap" class="hidden flex items-center gap-1.5 cursor-pointer" title="Show NHL 60-minute (three-way) markets as well as the two-way moneyline">
                <input id="nhl-three-way" type="checkbox" class="accent-amber-400"> NHL 3-way Result
              </label>
            </div>
          </div>

          <!-- Match & Lines / Scorers -->
          <div id="bets-view">
            <div class="overflow-x-auto -mx-1">
              <table class="w-full text-sm sm:min-w-[40rem]">
                <thead>
                  <tr class="text-xs text-gray-500 uppercase tracking-wider">
                    <th class="px-2 py-2 text-left font-semibold">Game</th>
                    <th class="px-2 py-2 text-left font-semibold">Selection</th>
                    <th class="px-2 py-2 text-right font-semibold" title="Median price across bookmakers where the market names them (scorers, NFL head-to-head and line); otherwise the best back price on the Betfair Exchange when last checked">Bookie odds</th>
                    <th class="hidden sm:table-cell px-2 py-2 text-right font-semibold" title="Model probability">Model</th>
                    <th class="px-2 py-2 text-right font-semibold" title="Model fair odds">Fair</th>
                    <th class="px-2 py-2 text-right font-semibold" title="Expected return per unit staked, after commission">Edge</th>
                    <th class="px-2 py-2 text-right font-semibold" title="How much of the bank to stake, from how settled bets like it have done: the same market (or all markets), an edge no higher, odds from half its own to the next step up. Nothing until those bets have proven a profit at the Risk level chosen. Hover a stake for where it comes from.">Stake</th>
                  </tr>
                </thead>
                <tbody id="bets-body"></tbody>
              </table>
            </div>
          </div>

          <p id="status" class="mt-3 text-xs text-gray-500"></p>
          <p id="method-note" class="mt-2 text-[11px] text-gray-600 leading-snug"></p>
        </div>

        <!-- Track record: actual ROI of settled bets by the edge they were flagged at -->
        <!-- Above the bets on a phone, beside them on a wide screen -->
        <aside class="card order-first lg:order-none" aria-labelledby="roi-title">
          <div class="flex items-baseline justify-between gap-3">
            <h2 id="roi-title" class="text-sm font-bold text-gray-100">Actual ROI by edge</h2>
            <a href="/pages/best_bets_analysis.html" class="shrink-0 text-xs text-blue-400 hover:underline font-medium">Detailed analysis →</a>
          </div>
          <p id="roi-scope" class="text-[11px] text-gray-500 mb-3"></p>
          <div id="roi-headline" class="mb-3"></div>
          <div id="roi-bars" class="space-y-1.5"></div>
          <!-- The small print is left off a phone, where this card sits above the bets -->
          <p id="roi-note" class="hidden sm:block mt-3 text-[11px] text-gray-600 leading-snug"></p>
        </aside>
        </div>
      </div>
    </main>

    <script type="module" src="/js/best-bets.js"></script>
    <script type="module">
      import { updateAuthNav } from '/js/supabase-client.js'
      updateAuthNav()
    </script>
    <div id="site-footer"></div>
    <script src="/js/load-footer.js"></script>
  </body>
</html>
