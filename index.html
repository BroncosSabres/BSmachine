<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T09VHK1QDP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-T09VHK1QDP');
    </script>
    <!-- Performance hints: preconnect + early backend wakeup -->
    <link rel="preconnect" href="https://bsmachine-backend.onrender.com" crossorigin>
    <link rel="dns-prefetch" href="https://bsmachine-backend.onrender.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <script>!function(){var K='bsm_backend_pinged',T=6e5,l=+sessionStorage.getItem(K)||0;if(Date.now()-l>=T){sessionStorage.setItem(K,String(Date.now()));fetch('https://bsmachine-backend.onrender.com/health',{cache:'no-store'}).catch(function(){});}}();</script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The BS Machine — Sports Power Rankings &amp; Predictions</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
  </head>
  <body class="bg-gray-900 text-white">
    <div id="site-header"></div>

    <main class="max-w-screen-xl mx-auto px-4 py-10">

      <!-- Hero -->
      <div class="mb-8 text-center">
        <h1 class="text-4xl font-bold mb-3">Sports Power Rankings &amp; Predictions</h1>
        <p class="text-gray-400 text-lg max-w-2xl mx-auto">
          A data-driven approach to tracking team performance, predicting outcomes, and visualising finals impact — across every sport we cover.
        </p>
      </div>

      <!-- Sport Hub -->
      <div id="sport-hub" class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-10"></div>

      <!-- Next 7 Days -->
      <div class="mb-2">
        <h2 class="text-2xl font-bold mb-1">Next 7 Days</h2>
        <p class="text-gray-500 text-sm mb-6">Upcoming matches across all sports, ordered by kickoff.</p>
      </div>
      <div id="upcoming-feed" class="flex flex-col gap-8"></div>
    </main>

    <script type="module" src="./js/homepage-predictions.js"></script>
    <script type="module">
      import { updateAuthNav } from './js/supabase-client.js'
      updateAuthNav()
    </script>
    <script>
      fetch('components/header.html')
        .then(res => res.text())
        .then(html => {
          document.getElementById("site-header").innerHTML = html;

          document.getElementById("bmc-button").innerHTML = `
            <a href="https://www.buymeacoffee.com/BroncosSabres" target="_blank" rel="noopener">
              <img src="https://cdn.buymeacoffee.com/buttons/v2/default-yellow.png"
                   alt="Buy Me a Coffee"
                   style="height: 40px; width: 145px;">
            </a>
          `;

          const menuToggle = document.getElementById("menu-toggle");
          const mobileMenu = document.getElementById("mobile-menu");
          if (menuToggle && mobileMenu) {
            menuToggle.addEventListener("click", () => {
              mobileMenu.classList.toggle("hidden");
            });
          }
        });
    </script>
    <div id="site-footer"></div>
    <script src="/js/load-footer.js"></script>
  </body>
</html>
