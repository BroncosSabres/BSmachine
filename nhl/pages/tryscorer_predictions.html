<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T09VHK1QDP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-T09VHK1QDP');

    <link rel="preconnect" href="https://bsmachine-backend.onrender.com" crossorigin>
    <link rel="dns-prefetch" href="https://bsmachine-backend.onrender.com">
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <script>!function(){var K='bsm_backend_pinged',T=6e5,l=+sessionStorage.getItem(K)||0;if(Date.now()-l>=T){sessionStorage.setItem(K,String(Date.now()));fetch('https://bsmachine-backend.onrender.com/health',{cache:'no-store'}).catch(function(){});}}();</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>Multi Builder | The BS Machine</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-900 text-white min-h-screen">
    <div id="site-header"></div>

    <main class="w-full max-w-6xl mx-auto px-4 py-4 md:py-8 pb-28 md:pb-8">
      <h1 class="text-2xl md:text-4xl font-bold mb-2 md:mb-3 text-center">Multi Builder</h1>
      <p class="hidden md:block mb-8 text-gray-400 text-center">
        Select a game, build your multi with goal scorers, assists, points, shots on goal and lines, and see the model's predicted odds!
      </p>

      <!-- GAME SELECTOR -->
      <div class="card">
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
          <div class="flex items-center gap-2 shrink-0">
            <button id="week-prev" type="button" class="px-3 py-2 rounded-lg bg-gray-700 border border-gray-600 text-gray-300 hover:border-gray-500 hover:text-white transition-colors">&larr;</button>
            <span id="week-badge" class="text-sm font-medium text-gray-400 text-center w-28">Date</span>
            <button id="week-next" type="button" class="px-3 py-2 rounded-lg bg-gray-700 border border-gray-600 text-gray-300 hover:border-gray-500 hover:text-white transition-colors">&rarr;</button>
          </div>
          <div class="flex-1 flex flex-col gap-1">
            <label for="game-select" class="text-xs font-semibold text-gray-400 uppercase tracking-widest">Select Game</label>
            <select id="game-select"
                    class="bg-gray-700 border border-gray-600 text-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-full"></select>
          </div>
        </div>
      </div>

      <p id="no-games-msg" class="hidden text-center text-gray-400 my-8">No games with prediction data this date.</p>

      <!-- FLEX ROW: team lists left, lines + betslip right -->
      <div id="builder-section" class="hidden w-full flex flex-col md:flex-row gap-6 md:gap-8 justify-center items-start pb-24 md:pb-0">
        <div id="teams-container" class="flex flex-col md:flex-row gap-6 md:gap-8 flex-1 order-2 md:order-1"></div>

        <div class="w-full md:w-72 shrink-0 order-1 md:order-2">
          <div id="sgm-extra-selectors" class="mb-4 flex flex-col gap-3">
            <div>
              <div id="builder-matchup" class="text-base font-semibold"></div>
              <div id="builder-kickoff" class="text-xs text-gray-400"></div>
            </div>

            <!-- Match Outcome -->
            <div class="flex flex-col gap-1">
              <span class="text-xs font-semibold text-gray-400 uppercase tracking-widest">Match Outcome</span>
              <div class="flex items-center gap-2">
                <div class="flex gap-1 shrink-0">
                  <button id="margin-dir-home" type="button"
                          class="line-dir-btn px-2.5 py-1.5 rounded-lg border border-gray-600 text-gray-400 text-xs font-semibold hover:border-blue-400 hover:text-white transition-colors">H</button>
                  <button id="margin-dir-away" type="button"
                          class="line-dir-btn px-2.5 py-1.5 rounded-lg border border-gray-600 text-gray-400 text-xs font-semibold hover:border-blue-400 hover:text-white transition-colors">A</button>
                </div>
                <select id="margin-val" disabled
                        class="flex-1 min-w-0 bg-gray-700 border border-gray-600 text-white rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:opacity-40 disabled:cursor-not-allowed"></select>
                <button id="margin-clear" type="button"
                        class="text-gray-400 hover:text-red-400 text-sm font-bold shrink-0 px-1 transition-colors">✕</button>
              </div>
            </div>

            <!-- Total Points -->
            <div class="flex flex-col gap-1">
              <span class="text-xs font-semibold text-gray-400 uppercase tracking-widest">Total Goals</span>
              <div class="flex items-center gap-2">
                <div class="flex gap-1 shrink-0">
                  <button id="total-dir-over" type="button"
                          class="line-dir-btn px-2.5 py-1.5 rounded-lg border border-gray-600 text-gray-400 text-xs font-semibold hover:border-blue-400 hover:text-white transition-colors">Over</button>
                  <button id="total-dir-under" type="button"
                          class="line-dir-btn px-2.5 py-1.5 rounded-lg border border-gray-600 text-gray-400 text-xs font-semibold hover:border-blue-400 hover:text-white transition-colors">Under</button>
                </div>
                <select id="total-val" disabled
                        class="flex-1 min-w-0 bg-gray-700 border border-gray-600 text-white rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:opacity-40 disabled:cursor-not-allowed"></select>
                <button id="total-clear" type="button"
                        class="text-gray-400 hover:text-red-400 text-sm font-bold shrink-0 px-1 transition-colors">✕</button>
              </div>
            </div>

            <!-- Home Team Pts -->
            <div class="flex flex-col gap-1">
              <span id="home-pts-label" class="text-xs font-semibold text-gray-400 uppercase tracking-widest">Home Goals</span>
              <div class="flex items-center gap-2">
                <div class="flex gap-1 shrink-0">
                  <button id="home-total-dir-over" type="button"
                          class="line-dir-btn px-2.5 py-1.5 rounded-lg border border-gray-600 text-gray-400 text-xs font-semibold hover:border-blue-400 hover:text-white transition-colors">Over</button>
                  <button id="home-total-dir-under" type="button"
                          class="line-dir-btn px-2.5 py-1.5 rounded-lg border border-gray-600 text-gray-400 text-xs font-semibold hover:border-blue-400 hover:text-white transition-colors">Under</button>
                </div>
                <select id="home-total-val" disabled
                        class="flex-1 min-w-0 bg-gray-700 border border-gray-600 text-white rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:opacity-40 disabled:cursor-not-allowed"></select>
                <button id="home-total-clear" type="button"
                        class="text-gray-400 hover:text-red-400 text-sm font-bold shrink-0 px-1 transition-colors">✕</button>
              </div>
            </div>

            <!-- Away Team Pts -->
            <div class="flex flex-col gap-1">
              <span id="away-pts-label" class="text-xs font-semibold text-gray-400 uppercase tracking-widest">Away Goals</span>
              <div class="flex items-center gap-2">
                <div class="flex gap-1 shrink-0">
                  <button id="away-total-dir-over" type="button"
                          class="line-dir-btn px-2.5 py-1.5 rounded-lg border border-gray-600 text-gray-400 text-xs font-semibold hover:border-blue-400 hover:text-white transition-colors">Over</button>
                  <button id="away-total-dir-under" type="button"
                          class="line-dir-btn px-2.5 py-1.5 rounded-lg border border-gray-600 text-gray-400 text-xs font-semibold hover:border-blue-400 hover:text-white transition-colors">Under</button>
                </div>
                <select id="away-total-val" disabled
                        class="flex-1 min-w-0 bg-gray-700 border border-gray-600 text-white rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:opacity-40 disabled:cursor-not-allowed"></select>
                <button id="away-total-clear" type="button"
                        class="text-gray-400 hover:text-red-400 text-sm font-bold shrink-0 px-1 transition-colors">✕</button>
              </div>
            </div>

            <div class="flex gap-2">
              <button id="reset-match-btn" type="button" disabled
                      class="flex-1 px-3 py-2 rounded-lg bg-gray-700 border border-gray-600 text-gray-300 font-semibold text-sm
                             disabled:opacity-40 disabled:cursor-not-allowed hover:border-gray-500 hover:text-white transition-colors">
                ↺ This Game
              </button>
              <button id="reset-all-btn" type="button" disabled
                      class="flex-1 px-3 py-2 rounded-lg bg-gray-700 border border-gray-600 text-gray-300 font-semibold text-sm
                             disabled:opacity-40 disabled:cursor-not-allowed hover:border-red-500 hover:text-red-400 transition-colors">
                ↺ All
              </button>
            </div>
          </div>

          <!-- Betslip (fixed bottom on mobile, bottom-right on desktop via .sgm-result) -->
          <div id="result" class="sgm-result md:w-80"></div>
        </div>
      </div>
    </main>

    <script type="module" src="/js/nhl_multi_builder.js"></script>
    <script type="module">
      import { updateAuthNav } from '/js/supabase-client.js'
      updateAuthNav()
    </script>
    <div id="site-footer"></div>
    <script src="/js/load-footer.js"></script>
  </body>
</html>
