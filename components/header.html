<header class="site-header">
  <div class="header-bar max-w-screen-xl mx-auto px-4">

    <!-- Logo -->
    <a href="/index.html" class="site-logo header-logo">
      THE <span class="site-logo-accent">BS</span> MACHINE
    </a>

    <!-- Competition tabs (populated by js/load-footer.js from js/sport-config.js) -->
    <nav id="comp-tabs" class="comp-tabs header-tabs" aria-label="Competitions"></nav>

    <!-- Right: auth nav + BMC + hamburger -->
    <div class="header-actions flex items-center gap-3">
      <div id="auth-nav"></div>
      <div id="bmc-button" class="hidden sm:block"></div>
      <button id="menu-toggle" type="button" class="menu-toggle md:hidden" aria-label="Menu" aria-expanded="false">
        <svg class="h-5 w-5 fill-current" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M0 3h20v2H0V3zm0 6h20v2H0V9zm0 6h20v2H0v-2z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Section nav for the current competition (hidden on general pages) -->
  <div id="section-nav-bar" class="section-nav-bar hidden">
    <nav id="desktop-nav" class="max-w-screen-xl mx-auto px-4 hidden md:flex items-center gap-0.5 overflow-x-auto" aria-label="Sections"></nav>
  </div>

  <!-- Mobile dropdown -->
  <div id="mobile-menu" class="mobile-menu hidden">
    <nav class="flex flex-col py-2">
      <a href="/index.html" class="mobile-nav-link">Home</a>
      <div id="mobile-nav-links"></div>
    </nav>
    <div id="mobile-bmc" class="sm:hidden" style="padding:0 1.5rem 0.5rem;"></div>
    <div style="border-top:1px solid #1e2a3a; padding:0.5rem 1.5rem 0.75rem; display:flex; gap:1rem;">
      <a href="/pages/terms.html"   class="mobile-legal-link">Terms &amp; Conditions</a>
      <a href="/pages/privacy.html" class="mobile-legal-link">Privacy Policy</a>
    </div>
  </div>
</header>

<!-- Match ticker (populated by js/match-ticker.js) -->
<div id="match-ticker" class="match-ticker"></div>

<!-- Prize Banner -->
<div id="prize-banner" class="prize-banner" style="display:none;">
  <div class="prize-banner-inner">
    <span class="prize-banner-trophy" aria-hidden="true">&#127942;</span>
    <span id="prize-banner-text" class="prize-banner-text">
      BS Cup is underway &mdash; The cup winner gets a <strong>$50 gift card!</strong>
    </span>
    <a href="/nrl/pages/leaderboard.html#cup" class="prize-banner-cta prize-banner-cta--secondary">Show Bracket</a>
    <a href="/nrl/pages/tipping.html" class="prize-banner-cta">Tip Now &rarr;</a>
    <button class="prize-banner-close" onclick="dismissPrizeBanner()" aria-label="Dismiss">&times;</button>
  </div>
</div>
