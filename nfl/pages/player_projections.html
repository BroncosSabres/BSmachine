<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T09VHK1QDP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-T09VHK1QDP');
    </script>
    <!-- Performance hints: preconnect + early backend wakeup -->
    <link rel="preconnect" href="https://bsmachine-backend.onrender.com" crossorigin>
    <link rel="dns-prefetch" href="https://bsmachine-backend.onrender.com">
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <script>!function(){var K='bsm_backend_pinged',T=6e5,l=+sessionStorage.getItem(K)||0;if(Date.now()-l>=T){sessionStorage.setItem(K,String(Date.now()));fetch('https://bsmachine-backend.onrender.com/health',{cache:'no-store'}).catch(function(){});}}();</script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NFL Player Projections</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-900 text-white" data-sport="nfl">
    <div id="site-header"></div>

    <main class="max-w-5xl mx-auto px-4 py-8">
      <div class="flex items-baseline gap-4 mb-2 flex-wrap">
        <h1 class="text-4xl font-bold">Player Projections</h1>
        <span id="as-of" class="text-sm font-medium text-gray-500 bg-gray-800 border border-gray-700 px-2.5 py-1 rounded-full"></span>
      </div>
      <p class="text-sm text-gray-400 mb-6">Projected regular-season leaders: touchdowns so far plus the model's expected touchdowns in every remaining game, and each player's chance to finish on top.</p>

      <div class="card">
        <div class="flex items-center justify-between gap-3 flex-wrap mb-4">
          <div id="stat-tabs" role="tablist" class="flex items-center bg-gray-900 border border-gray-700 rounded-lg p-0.5 gap-0.5"></div>
          <input id="player-search" type="search" placeholder="Search player or team"
                 class="w-full sm:w-56 bg-gray-800 border border-gray-600 rounded px-2.5 py-1.5 text-sm text-white placeholder-gray-500">
        </div>
        <div class="overflow-x-auto -mx-1">
          <table class="w-full text-sm sm:min-w-[40rem]">
            <thead>
              <tr class="text-xs text-gray-500 uppercase tracking-wider">
                <th class="px-2 py-2 text-right font-semibold">#</th>
                <th class="px-2 py-2 text-left font-semibold">Player</th>
                <th class="hidden sm:table-cell px-2 py-2 text-right font-semibold" title="Games played this regular season">GP</th>
                <th class="px-2 py-2 text-right font-semibold" title="This regular season so far"><span id="unit-head">TD</span> so far</th>
                <th class="hidden sm:table-cell px-2 py-2 text-right font-semibold" title="Expected in the team's remaining games">Remaining</th>
                <th class="px-2 py-2 text-right font-semibold" title="Projected regular-season total">Proj. total</th>
                <th class="px-2 py-2 text-right font-semibold" title="Chance to lead the league">Lead</th>
                <th class="hidden sm:table-cell px-2 py-2 text-right font-semibold" title="Chance to finish in the top 5">Top 5</th>
                <th class="px-2 py-2 text-right font-semibold" title="Chance to finish in the top 10">Top 10</th>
              </tr>
            </thead>
            <tbody id="proj-body"></tbody>
          </table>
        </div>
        <p id="proj-status" class="mt-3 text-xs text-gray-500"></p>
        <p id="method-note" class="mt-2 text-[11px] text-gray-600 leading-snug"></p>
      </div>
    </main>

    <script type="module" src="/js/player-projections.js"></script>
    <script type="module">
      import { updateAuthNav } from '/js/supabase-client.js'
      updateAuthNav()
    </script>
    <div id="site-footer"></div>
    <script src="/js/load-footer.js"></script>
  </body>
</html>
