<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T09VHK1QDP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-T09VHK1QDP');
    </script>
    <link rel="preconnect" href="https://bsmachine-backend.onrender.com" crossorigin>
    <link rel="dns-prefetch" href="https://bsmachine-backend.onrender.com">
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <script>!function(){var K='bsm_backend_pinged',T=6e5,l=+sessionStorage.getItem(K)||0;if(Date.now()-l>=T){sessionStorage.setItem(K,String(Date.now()));fetch('https://bsmachine-backend.onrender.com/health',{cache:'no-store'}).catch(function(){});}}();</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>Multi Builder | The BS Machine</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-900 text-white min-h-screen">
    <div id="site-header"></div>

    <main class="w-full max-w-3xl mx-auto px-4 py-4 md:py-8">
      <h1 class="text-2xl md:text-4xl font-bold mb-2 md:mb-3 text-center">Multi Builder</h1>
      <p class="hidden md:block mb-8 text-gray-400 text-center">
        Select a game, build a margin / total points / team points multi, and see the model's predicted odds!
      </p>

      <!-- GAME SELECTOR -->
      <div class="card">
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
          <button id="week-prev" type="button" class="px-3 py-2 rounded-lg bg-gray-700 border border-gray-600 text-gray-300 hover:border-gray-500 hover:text-white transition-colors shrink-0">&larr;</button>
          <span id="week-badge" class="text-sm font-medium text-gray-400 shrink-0 text-center sm:w-24">Week</span>
          <button id="week-next" type="button" class="px-3 py-2 rounded-lg bg-gray-700 border border-gray-600 text-gray-300 hover:border-gray-500 hover:text-white transition-colors shrink-0">&rarr;</button>
          <div class="flex-1 flex flex-col gap-1">
            <label for="game-select" class="text-xs font-semibold text-gray-500 uppercase tracking-widest">Select Game</label>
            <select id="game-select"
                    class="bg-gray-700 border border-gray-600 text-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-full"></select>
          </div>
        </div>
      </div>

      <p id="no-games-msg" class="hidden text-center text-gray-500 my-8">No games with prediction data this week.</p>

      <!-- BUILDER -->
      <div id="builder-section" class="hidden">
        <div class="card">
          <div class="flex items-center justify-between mb-4">
            <div>
              <div id="builder-matchup" class="text-lg font-semibold"></div>
              <div id="builder-kickoff" class="text-xs text-gray-500"></div>
            </div>
            <button id="reset-builder-btn" type="button" disabled
                    class="px-3 py-2 rounded-lg bg-gray-700 border border-gray-600 text-gray-300 font-semibold text-sm
                           disabled:opacity-40 disabled:cursor-not-allowed hover:border-red-500 hover:text-red-400 transition-colors">
              ↺ Reset
            </button>
          </div>

          <div class="flex flex-col gap-4">
            <!-- Match Outcome -->
            <div class="flex flex-col gap-2">
              <span class="text-xs font-semibold text-gray-500 uppercase tracking-widest">Match Outcome</span>
              <div class="flex items-center gap-2">
                <div class="flex gap-1 shrink-0">
                  <button id="margin-dir-home" type="button"
                          class="line-dir-btn px-3 py-1.5 rounded-lg border border-gray-600 text-gray-400 text-xs font-semibold hover:border-blue-400 hover:text-white transition-colors">Home</button>
                  <button id="margin-dir-away" type="button"
                          class="line-dir-btn px-3 py-1.5 rounded-lg border border-gray-600 text-gray-400 text-xs font-semibold hover:border-blue-400 hover:text-white transition-colors">Away</button>
                </div>
                <select id="margin-val" disabled
                        class="flex-1 min-w-0 bg-gray-700 border border-gray-600 text-white rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:opacity-40 disabled:cursor-not-allowed"></select>
                <button id="margin-clear" type="button"
                        class="text-gray-500 hover:text-red-400 text-sm font-bold shrink-0 px-1 transition-colors">✕</button>
              </div>
            </div>

            <!-- Total Points -->
            <div class="flex flex-col gap-1">
              <span class="text-xs font-semibold text-gray-500 uppercase tracking-widest">Total Points</span>
              <div class="flex items-center gap-2">
                <div class="flex gap-1 shrink-0">
                  <button id="total-dir-over" type="button"
                          class="line-dir-btn px-3 py-1.5 rounded-lg border border-gray-600 text-gray-400 text-xs font-semibold hover:border-blue-400 hover:text-white transition-colors">Over</button>
                  <button id="total-dir-under" type="button"
                          class="line-dir-btn px-3 py-1.5 rounded-lg border border-gray-600 text-gray-400 text-xs font-semibold hover:border-blue-400 hover:text-white transition-colors">Under</button>
                </div>
                <select id="total-val" disabled
                        class="flex-1 min-w-0 bg-gray-700 border border-gray-600 text-white rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:opacity-40 disabled:cursor-not-allowed"></select>
                <button id="total-clear" type="button"
                        class="text-gray-500 hover:text-red-400 text-sm font-bold shrink-0 px-1 transition-colors">✕</button>
              </div>
            </div>

            <!-- Home Team Pts -->
            <div class="flex flex-col gap-1">
              <span id="home-pts-label" class="text-xs font-semibold text-gray-500 uppercase tracking-widest">Home Pts</span>
              <div class="flex items-center gap-2">
                <div class="flex gap-1 shrink-0">
                  <button id="home-total-dir-over" type="button"
                          class="line-dir-btn px-3 py-1.5 rounded-lg border border-gray-600 text-gray-400 text-xs font-semibold hover:border-blue-400 hover:text-white transition-colors">Over</button>
                  <button id="home-total-dir-under" type="button"
                          class="line-dir-btn px-3 py-1.5 rounded-lg border border-gray-600 text-gray-400 text-xs font-semibold hover:border-blue-400 hover:text-white transition-colors">Under</button>
                </div>
                <select id="home-total-val" disabled
                        class="flex-1 min-w-0 bg-gray-700 border border-gray-600 text-white rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:opacity-40 disabled:cursor-not-allowed"></select>
                <button id="home-total-clear" type="button"
                        class="text-gray-500 hover:text-red-400 text-sm font-bold shrink-0 px-1 transition-colors">✕</button>
              </div>
            </div>

            <!-- Away Team Pts -->
            <div class="flex flex-col gap-1">
              <span id="away-pts-label" class="text-xs font-semibold text-gray-500 uppercase tracking-widest">Away Pts</span>
              <div class="flex items-center gap-2">
                <div class="flex gap-1 shrink-0">
                  <button id="away-total-dir-over" type="button"
                          class="line-dir-btn px-3 py-1.5 rounded-lg border border-gray-600 text-gray-400 text-xs font-semibold hover:border-blue-400 hover:text-white transition-colors">Over</button>
                  <button id="away-total-dir-under" type="button"
                          class="line-dir-btn px-3 py-1.5 rounded-lg border border-gray-600 text-gray-400 text-xs font-semibold hover:border-blue-400 hover:text-white transition-colors">Under</button>
                </div>
                <select id="away-total-val" disabled
                        class="flex-1 min-w-0 bg-gray-700 border border-gray-600 text-white rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:opacity-40 disabled:cursor-not-allowed"></select>
                <button id="away-total-clear" type="button"
                        class="text-gray-500 hover:text-red-400 text-sm font-bold shrink-0 px-1 transition-colors">✕</button>
              </div>
            </div>
          </div>
        </div>

        <!-- RESULT -->
        <div id="result-card" class="card hidden">
          <div class="flex flex-col items-center gap-1 text-center">
            <span class="text-xs font-semibold text-gray-500 uppercase tracking-widest">Selected Multi</span>
            <div id="result-legs" class="text-sm text-gray-300 mb-2"></div>
            <span id="result-prob" class="text-4xl font-bold text-white"></span>
            <span id="result-odds" class="text-lg font-semibold text-amber-400"></span>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="/js/nfl_multi_builder.js"></script>
    <script type="module">
      import { updateAuthNav } from '/js/supabase-client.js'
      updateAuthNav()
    </script>
    <script>
      fetch('/components/header.html')
        .then(res => res.text())
        .then(html => {
          document.getElementById("site-header").innerHTML = html;

          document.getElementById("bmc-button").innerHTML = `
            <a href="https://www.buymeacoffee.com/BroncosSabres" target="_blank" rel="noopener">
              <img src="https://cdn.buymeacoffee.com/buttons/v2/default-yellow.png"
                   alt="Buy Me a Coffee"
                   style="height: 40px; width: 145px;">
            </a>
          `;

          const menuToggle = document.getElementById("menu-toggle");
          const mobileMenu = document.getElementById("mobile-menu");
          if (menuToggle && mobileMenu) {
            menuToggle.addEventListener("click", () => {
              mobileMenu.classList.toggle("hidden");
            });
          }
        });
    </script>
    <div id="site-footer"></div>
    <script src="/js/load-footer.js"></script>
  </body>
</html>
