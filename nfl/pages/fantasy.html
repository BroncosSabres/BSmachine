<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T09VHK1QDP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-T09VHK1QDP');
    </script>
    <!-- Performance hints: preconnect + early backend wakeup -->
    <link rel="preconnect" href="https://bsmachine-backend.onrender.com" crossorigin>
    <link rel="dns-prefetch" href="https://bsmachine-backend.onrender.com">
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <script>!function(){var K='bsm_backend_pinged',T=6e5,l=+sessionStorage.getItem(K)||0;if(Date.now()-l>=T){sessionStorage.setItem(K,String(Date.now()));fetch('https://bsmachine-backend.onrender.com/health',{cache:'no-store'}).catch(function(){});}}();</script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NFL Fantasy</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-900 text-white" data-sport="nfl">
    <div id="site-header"></div>

    <main class="max-w-6xl mx-auto px-4 py-8">
      <div class="flex items-baseline gap-4 mb-2 flex-wrap">
        <h1 class="text-4xl font-bold">Fantasy</h1>
        <span id="as-of" class="text-sm font-medium text-gray-500 bg-gray-800 border border-gray-700 px-2.5 py-1 rounded-full"></span>
      </div>
      <p class="text-sm text-gray-400 mb-6">Positional rankings from the match and player models, and waiver-wire targets: rising usage, Sleeper adds, and players stepping in for injured starters.</p>

      <div class="card">
        <!-- view + global settings -->
        <div class="flex items-center justify-between gap-3 flex-wrap mb-3">
          <div id="view-tabs" role="tablist" class="flex items-center bg-gray-900 border border-gray-700 rounded-lg p-0.5 gap-0.5"></div>
          <div class="flex items-center gap-2 flex-wrap">
            <div id="format-tabs" role="radiogroup" aria-label="Scoring format" class="flex items-center bg-gray-900 border border-gray-700 rounded-lg p-0.5 gap-0.5"></div>
            <label class="flex items-center gap-1.5 text-xs text-gray-400">
              <span class="sr-only sm:not-sr-only">League</span>
              <select id="league-size" class="bg-gray-800 border border-gray-600 rounded px-2 py-1.5 text-sm text-white">
                <option value="8">8 teams</option>
                <option value="10">10 teams</option>
                <option value="12">12 teams</option>
                <option value="14">14 teams</option>
              </select>
            </label>
          </div>
        </div>

        <!-- per-view filters -->
        <div class="flex items-center justify-between gap-3 flex-wrap mb-4">
          <div class="flex items-center gap-2 flex-wrap">
            <div id="pos-tabs" role="tablist" aria-label="Position" class="flex items-center flex-wrap bg-gray-900 border border-gray-700 rounded-lg p-0.5 gap-0.5"></div>
            <div id="horizon-tabs" role="radiogroup" aria-label="Horizon" class="flex items-center bg-gray-900 border border-gray-700 rounded-lg p-0.5 gap-0.5"></div>
          </div>
          <input id="player-search" type="search" placeholder="Search player or team"
                 class="w-full sm:w-56 bg-gray-800 border border-gray-600 rounded px-2.5 py-1.5 text-sm text-white placeholder-gray-500">
        </div>

        <div id="rankings-view" class="overflow-x-auto -mx-1">
          <table class="w-full text-sm sm:min-w-[44rem]">
            <thead id="rank-head"></thead>
            <tbody id="rank-body"></tbody>
          </table>
        </div>

        <div id="waiver-view" class="hidden overflow-x-auto -mx-1">
          <table class="w-full text-sm">
            <thead>
              <tr class="text-xs text-gray-500 uppercase tracking-wider">
                <th class="px-2 py-2 text-right font-semibold">#</th>
                <th class="px-2 py-2 text-left font-semibold">Player · why</th>
                <th class="hidden sm:table-cell px-2 py-2 text-left font-semibold">Opp</th>
                <th class="px-2 py-2 text-right font-semibold" title="Increase in fantasy value, points per week (the largest of: injury opening, recent scoring surge, projection jump, streaming edge)">Gain</th>
                <th class="px-2 py-2 text-right font-semibold" title="Projected points this week">Week</th>
                <th class="hidden sm:table-cell px-2 py-2 text-right font-semibold" title="Projected points per remaining game (replacement level in grey)">ROS/G</th>
              </tr>
            </thead>
            <tbody id="waiver-list"></tbody>
          </table>
        </div>

        <p id="fan-status" class="mt-3 text-xs text-gray-500"></p>
        <p id="method-note" class="mt-2 text-[11px] text-gray-600 leading-snug"></p>
      </div>
    </main>

    <script type="module" src="/js/nfl-fantasy.js"></script>
    <script type="module">
      import { updateAuthNav } from '/js/supabase-client.js'
      updateAuthNav()
    </script>
    <div id="site-footer"></div>
    <script src="/js/load-footer.js"></script>
  </body>
</html>
